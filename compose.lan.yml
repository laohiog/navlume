# Navlume v0.1.2: paste as a NEW Compose project for a fresh LAN installation.
# Image source: 3a9ad4c716b0f961dd089969c387603e4e631576 (release docs are separate).
# HTTP is unencrypted. Use a trusted LAN and promptly claim the administrator.
# Existing installations: back up first and follow docs/INSTALL.md volume rules.
name: navlume-lan
services:
  app:
    image: ghcr.io/laohiog/navlume@sha256:f1178e3a8954c00e56e5c178006224d3421ee93b739a2d71025a1a71bb80be4d
    platform: linux/amd64
    restart: unless-stopped
    ports:
      # Replace NAS IP here and below. Change BOTH 3000 host ports if needed.
      - "192.168.1.100:3000:3000"
    environment:
      NODE_ENV: production
      INSTALL_MODE: lan-http
      BETTER_AUTH_URL: http://192.168.1.100:3000
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/nav.sqlite
      UPLOADS_DIR: /data/uploads
    volumes:
      - navigation-data:/data
volumes:
  navigation-data:
