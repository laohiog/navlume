# Navlume v0.1.3 LAN installation template.
# Paste as a NEW Compose project for a fresh LAN installation.
# Image source: 361aaa6439ba16e3579d097629ac75fe2df4fc91; docs commit: see RELEASE-IDENTITY.json.
# HTTP is unencrypted. Use a trusted LAN and promptly claim the administrator.
# Existing installations: back up first and follow docs/INSTALL.md volume rules.
name: navlume-lan
services:
  app:
    image: ghcr.io/laohiog/navlume@sha256:81081c094488af19bda6fa1d0b37a582c76053084ce9410d358f15efe70af857
    platform: linux/amd64
    restart: unless-stopped
    ports:
      # Replace NAS IP here and below. Change BOTH 3000 host ports if needed.
      - "192.168.1.100:3000:3000"
    environment:
      NODE_ENV: production
      INSTALL_MODE: lan-http
      BETTER_AUTH_URL: http://192.168.1.100:3000
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/nav.sqlite
      UPLOADS_DIR: /data/uploads
    volumes:
      - navigation-data:/data
volumes:
  navigation-data:
